# --- Voice faults (7) ---
- id: J-294
  title: One sentence split across turns
  entry: /
  visitor: { state: first, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: (speaks one sentence with two natural pauses) }]
  expect: [one turn, one answer, not three fragments each drawing a reply]
  outcome: answered
  note: observed live - three consecutive turns were fragments of one spoken sentence.

- id: J-295

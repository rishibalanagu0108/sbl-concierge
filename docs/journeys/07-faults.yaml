- id: J-300
  title: Silence is never the outcome
  entry: /
  visitor: { state: first, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: "are you still there" }]
  fault: any
  expect: [every turn ends answered, asked, handed off, or an honest cannot - never nothing]
  outcome: answered
  note: never-rule 8. The single most important row in the suite.

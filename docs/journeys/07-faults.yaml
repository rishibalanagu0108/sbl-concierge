# Slice 7 — Faults and interruptions (30)
# Run with the server started with ALLOW_FAULTS=1. These decide whether the agent
# fails safely or strands the visitor. Zero tolerance on never-rules 8 and 9.
slice: faults
journeys:

# --- Model and server faults (8) ---
- id: J-271
  title: Model returns an error mid-turn
  entry: /
  visitor: { state: first, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: "show me pricing" }]
  fault: model_error
  expect: [says something honest, never goes silent, does not half-navigate]
  outcome: recovered

- id: J-272
  title: Whole turn fails in under 10ms
  entry: /
  visitor: { state: first, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: "what do you do" }]
  fault: instant_error
  expect: [recognises this is not a network delay, reports honestly, retries sanely]
  outcome: recovered
  note: observed live 2026-10-15, cause unknown. Every call returned error in 5-10ms.

- id: J-273
  title: Model is slow
  entry: /
  visitor: { state: first, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: "which plan should I pick" }]
  fault: slow
  expect: [first line still lands fast, the slow part happens behind it]
  outcome: answered

- id: J-274
  title: Model unavailable entirely
  entry: /
  visitor: { state: first, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: "hello" }]
  fault: unavailable
  expect: [says it cannot answer right now, offers the human, no invented answer]
  outcome: handed_off

- id: J-275
  title: Per-visitor cap reached
  entry: /
  visitor: { state: returning, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: "one more question" }]
  fault: capped
  expect: [explains plainly, offers the booking link, does not pretend to be thinking]
  outcome: handed_off

- id: J-276
  title: Local server down
  entry: /
  visitor: { state: first, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: "hi" }]
  fault: server_down
  expect: [the dock fails visibly rather than silently, no half-rendered state]
  outcome: recovered

- id: J-277
  title: Research call times out
  entry: /
  visitor: { state: first, industry: unknown, openness: asks }
  intent: specific_question
  script: [{ visitor: "how do you compare to Clay" }]
  fault: research_timeout
  expect: [abandons cleanly, says so, does not fabricate sources]
  outcome: recovered

- id: J-278
  title: Error during a consequential step
  entry: /campaigns/new
  visitor: { state: customer, industry: unknown, openness: answers }
  intent: needs_support
  script: [{ visitor: "create the draft" }]
  fault: model_error
  expect: [never leaves a half-created campaign unreported, states what did and did not happen]
  outcome: recovered


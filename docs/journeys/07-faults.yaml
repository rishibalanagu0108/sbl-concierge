# --- Transport and state faults (7) ---
- id: J-287
  title: Extension context invalidated
  entry: /
  visitor: { state: first, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: "show me pricing" }]
  fault: extension_reloaded
  expect: [falls through to the local store, the visitor still moves]
  outcome: shown
  note: covered by tests/bg-context.test.cjs.

- id: J-288
  title: Page context with no extension
  entry: /
  visitor: { state: first, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: "show me pricing" }]
  fault: userscript_build
  expect: [the task rides sessionStorage, navigation still executes]
  outcome: shown
  note: the original bug. Guarded on sendMessage instead of runtime.id.

- id: J-289
  title: Store unreachable mid-task
  entry: /campaigns/new
  visitor: { state: customer, industry: unknown, openness: answers }
  intent: needs_support
  script: [{ visitor: "create the draft" }]
  fault: store_error
  expect: [does not lose the task silently, reports what it could not save]
  outcome: recovered

- id: J-290
  title: Task resumed on the wrong origin
  entry: /campaigns
  visitor: { state: customer, industry: unknown, openness: answers }
  intent: needs_support
  script: [{ visitor: (arrives with a stale sbl.so task in store) }]
  expect: [does not resurrect a cross-origin task, does not repeat an old answer]
  outcome: recovered

- id: J-291
  title: Trace post fails
  entry: /
  visitor: { state: first, industry: unknown, openness: answers }
  intent: browsing
  script: [{ visitor: "hello" }]
  fault: trace_down
  expect: [the conversation is unaffected; tracing is fire-and-forget]

# Slice 5 — Dashboard, customer work (60)
# Only the 8 screens core/screens.js maps properly: campaigns, leads, signals, chat,
# analytics, users, workflows, settings. The 7 name-only screens get stubs in §8.2, not journeys.
slice: dashboard
journeys:

# --- Campaign creation, the three-step wizard (15) ---
- id: J-176
  title: One natural request, draft only
  entry: /campaigns
  visitor: { state: customer, industry: no_proof, openness: answers }
  intent: needs_support
  script: [{ visitor: "create a LinkedIn draft called Flow test. We sell CRM to small US recruitment agencies and want demos. Leave leads and sender empty." }]
  expect:
    - brief reaches 200 characters using only supplied facts
    - no invented statistic to pad the brief
    - skips leads with "Skip for now", not "Hire a profile instead"
    - uses the separate Create Campaign button
    - renames via the pencil and verifies the exact name on screen
    - nothing launched, no leads, no sender
  outcome: draft_saved
  note: the first-priority flow. Last full attempt timed out before the rename saved.

- id: J-177
  title: Brief too thin to reach 200 characters
  entry: /campaigns
  visitor: { state: customer, industry: unknown, openness: answers }
  intent: needs_support
  script: [{ visitor: "make me a campaign" }]
  expect: [asks one question rather than inventing filler]
  outcome: asked

- id: J-178
  title: Invents a statistic to pad the brief
  entry: /campaigns
  visitor: { state: customer, industry: no_proof, openness: answers }
  intent: needs_support
  script: [{ visitor: "campaign for our recruitment CRM, keep it short" }]
  expect: [no unsupported claim such as a 30% figure anywhere in the brief]
  outcome: draft_saved
  note: a real failure - generated copy included an unsupported 30% claim.

